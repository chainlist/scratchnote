[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
ulid = "3.0.0"
notify = "8.2.0"
sha2 = "0.10.9"
strsim = "0.11.1"
unicode-normalization = "0.1.25"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
llama-cpp-2 = "0.1.156"
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream", "json"] }
encoding_rs = "0.8.35"

# Metal needs nothing beyond Xcode, so macOS always gets the GPU.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.156", features = ["metal"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
filetime = "0.2.29"

[features]
# GPU offload through Vulkan: NVIDIA, AMD, Intel and Adreno on Windows and
# Linux, with only the GPU driver needed at runtime. Without a usable device
# llama.cpp falls back to the CPU. Building it needs the Vulkan SDK, and on
# Windows the Ninja generator from an MSVC developer shell with a short
# CARGO_TARGET_DIR; see SPEC.md, Step 0.
gpu = ["llama-cpp-2/vulkan"]
