[package]
name = "app"
version = "0.9.1"
description = "A daily notes journal"
authors = ["kguillouard"]
license = ""
repository = ""
edition = "2021"
# The oldest Rust the locked dependencies build with (`time` and
# `darling` ask for 1.88).
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
ulid = "3.0.0"
notify = "8.2.0"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The defaults minus android-shared-stdcxx, which Android swaps for the
# static C++ runtime below.
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["openmp", "common"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream", "json"] }
encoding_rs = "0.8.35"
tauri-plugin-opener = "2"
sys-locale = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
percent-encoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Android ships no C++ runtime for apps, so llama.cpp links its own in.
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["android-static-stdcxx"] }
# Root certificates for HTTPS, see src/http.rs.
webpki-root-certs = "1"

[dev-dependencies]
filetime = "0.2.29"
