<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Room for every file a dev build loads one by one, which the
			// startup details count (#lib/app/startup.js); 250 by default.
			performance.setResourceTimingBufferSize(5000);
			// Repaint what applyAppearance last painted before anything renders,
			// so a light window does not open dark and wait for the settings.
			{
				const painted = JSON.parse(localStorage.getItem('appearance'));
				if (painted) {
					document.documentElement.classList.toggle('dark', painted.dark);
					document.documentElement.classList.toggle('less-motion', !!painted.less);
					document.documentElement.style.cssText = painted.style;
				}
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
